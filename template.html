<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceAI — LLM от нуля в браузере</title>
  <style>
    :root { --bg:#0b0f14; --fg:#e8eef4; --muted:#6b7c8a; --acc:#00d4aa; --acc2:#0099ff; --card:#111820; --border:#23303d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui, sans-serif; background:var(--bg); color:var(--fg); line-height:1.5; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:2rem 1rem; }
    .container { width:100%; max-width:900px; }
    header { text-align:center; margin-bottom:2rem; }
    h1 { font-size:clamp(1.8rem,4vw,2.6rem); margin:0 0 0.5rem; background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .subtitle { color:var(--muted); font-size:1.05rem; }
    h2 { font-size:1.2rem; margin:0 0 1rem; color:var(--fg); border-bottom:1px solid var(--border); padding-bottom:0.5rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; margin-bottom:1.5rem; }
    label { display:block; font-size:0.9rem; color:var(--muted); margin-bottom:0.5rem; }
    textarea, input[type=text], input[type=number], select { width:100%; background:#0a0f14; border:1px solid var(--border); color:var(--fg); border-radius:8px; padding:0.6rem 0.75rem; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:0.9rem; resize:vertical; }
    textarea { min-height:80px; }
    select { color-scheme:dark; }
    input[type=number], select { width:auto; }
    .row { display:flex; gap:0.75rem; flex-wrap:wrap; margin-top:1rem; align-items:center; }
    .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:0.75rem; margin-top:1rem; }
    button { background:linear-gradient(90deg,var(--acc),var(--acc2)); border:none; color:#051014; font-weight:600; padding:0.7rem 1.2rem; border-radius:8px; cursor:pointer; font-size:0.95rem; transition:opacity .2s; }
    button:hover { opacity:0.9; }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    button.ghost { background:transparent; color:var(--fg); border:1px solid var(--border); }
    .output { background:#0a0f14; border:1px solid var(--border); border-radius:8px; padding:1rem; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:0.85rem; white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto; }
    .stats { display:flex; gap:1rem; flex-wrap:wrap; margin-top:0.75rem; font-size:0.85rem; color:var(--muted); }
    .stat { background:#0a0f14; border:1px solid var(--border); padding:0.4rem 0.8rem; border-radius:6px; }
    .stat strong { color:var(--fg); }
    footer { margin-top:2rem; text-align:center; color:var(--muted); font-size:0.8rem; }
    a { color:var(--acc2); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .hidden { display:none; }
    .progress { height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-top:0.75rem; }
    .progress-bar { height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); width:0%; transition:width 0.15s; }
    canvas { display:block; margin-top:0.75rem; border:1px solid var(--border); border-radius:8px; background:#0a0f14; }
    .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:0.85rem; color:var(--muted); white-space:pre; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SpaceAI</h1>
      <p class="subtitle">LLM от нуля — чистый TypeScript/JS, обучение прямо в браузере</p>
    </header>

    <section class="card">
      <h2>Токенизатор BPE</h2>
      <label>Корпус для обучения токенизатора</label>
      <textarea id="tok-corpus"></textarea>
      <div class="row">
        <label style="margin:0;">Vocab size</label>
        <input type="number" id="tok-vocab" value="2000" min="257" max="100000">
        <button id="tok-train">Обучить</button>
        <span id="tok-status" style="color:var(--muted); font-size:0.85rem;"></span>
      </div>
      <div class="progress"><div class="progress-bar" id="tok-progress"></div></div>
      <div class="stats" id="tok-stats"></div>
      <label style="margin-top:1.25rem;">Encode / Decode</label>
      <textarea id="tok-text" placeholder="Текст для encode или JSON-массив id для decode…"></textarea>
      <div class="row" style="margin-top:1rem;">
        <button id="tok-encode">Encode</button>
        <button id="tok-decode">Decode</button>
      </div>
      <div class="output" id="tok-output"></div>
    </section>

    <section class="card">
      <h2>GPT-модель (байтовый уровень)</h2>
      <div class="grid2">
        <div>
          <label>Преcет размера</label>
          <select id="m-preset">
            <option value="fast">Быстрый (мин. для демо)</option>
            <option value="tiny" selected>Компактный (~120k)</option>
            <option value="small">Средний (~530k)</option>
          </select>
        </div>
        <div>
          <label>Шагов обучения</label>
          <input type="number" id="m-steps" value="200" min="10" max="5000">
        </div>
        <div>
          <label>Batch size</label>
          <input type="number" id="m-batch" value="8" min="1" max="64">
        </div>
      </div>
      <label style="margin-top:1rem;">Корпус (текст для обучения)</label>
      <textarea id="m-corpus"></textarea>
      <div class="row">
        <button id="m-train">Обучить модель</button>
        <button id="m-stop" class="ghost" disabled>Стоп</button>
        <span id="m-status" style="color:var(--muted); font-size:0.85rem;"></span>
      </div>
      <div class="progress"><div class="progress-bar" id="m-progress"></div></div>
      <canvas id="m-chart" width="840" height="90"></canvas>
      <div class="stats" id="m-stats"></div>

      <label style="margin-top:1.25rem;">Генерация</label>
      <div class="grid2">
        <div style="grid-column:1/-1;">
          <input type="text" id="m-prompt" placeholder="Промпт, например: The fox" style="min-width:0;">
        </div>
        <div>
          <label>Temperature</label>
          <input type="number" id="m-temp" value="0.7" min="0.1" max="2" step="0.1">
        </div>
        <div>
          <label>Top-K</label>
          <input type="number" id="m-topk" value="40" min="1" max="256">
        </div>
      </div>
      <div class="row">
        <button id="m-generate" disabled>Сгенерировать</button>
        <label style="margin:0; display:inline-flex; align-items:center; gap:0.4rem;">
          <input type="checkbox" id="m-stream" checked> поток текста
        </label>
      </div>
      <div class="output" id="m-output" style="margin-top:0.75rem;"></div>
    </section>

    <footer>
      <a href="https://github.com/SpaceZhenya/SpaceAIchic" target="_blank">GitHub</a>
    </footer>
  </div>

  <!--APP-->
</body>
</html>
